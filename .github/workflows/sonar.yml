name: SonarCloud Coverage

on:
  push:
    branches:
      - main

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests, JaCoCo coverage and SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw clean verify sonar:sonar -Pcoverage -Dspring.profiles.active=local -Dsonar.projectKey=dev-aitana_logicorp -Dsonar.organization=dev-aitana -Dsonar.host.url=https://sonarcloud.io